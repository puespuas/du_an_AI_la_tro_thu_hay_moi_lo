  function updateCalculator() {
    const v=state.calculator;const output=document.getElementById('calculation-result');if(!output)return;
    const keys=['activity','product','teacher','peer','reflection'];
    if(!keys.every(k=>v[k]!==''&&v[k]!==undefined&&Number.isFinite(Number(v[k])))) {output.textContent='Điền đủ 5 thành phần để tính.';return;}
    if(keys.some(k=>Number(v[k])<0 || Number(v[k])>10)){output.textContent='Mỗi điểm phải nằm trong khoảng 0–10.';return;}
    const presentation=Number(v.teacher)*.6+Number(v.peer)*.4;
    const total=Number(v.activity)*.2+Number(v.product)*.5+presentation*.2+Number(v.reflection)*.1;
    output.innerHTML=`Điểm ước tính: <strong>${number(total)}</strong> / 10 <span class="fine">· Trình bày: ${number(presentation)} / 10</span>`;
  }

  function openResource(id) {
    const r=R.find(x=>x.id===id);if(!r)return;
    if(r.type==='FORM' || r.type==='DOSSIER') {
      const url=safeUrl(r.url);if(url)window.open(url,'_blank','noopener,noreferrer');return;
    }
    lastFocus=document.activeElement;
    const dialog=document.getElementById('resource-dialog');
    const title=document.getElementById('resource-dialog-title');title.textContent=r.title;
    const url=safeUrl(r.url);if(!url)return;
    const body=document.getElementById('dialog-body');
    const downloadable=r.origin==='supplement';
    const download=downloadable?`<a class="button secondary small" href="${esc(url)}" download="${esc(r.name)}">Tải PDF${icon('download')}</a>`:'';
    body.innerHTML=`<div class="dialog-meta"><span>${esc(r.folderLabel)} · ${esc(r.type)}${downloadable?' · Bản bổ sung đi kèm web':''}</span><div class="button-row">${link(url,'Mở ở tab mới','button small')}${download}</div></div>`;
    if(r.type==='PDF' || r.type==='PNG') {
      const preview=downloadable?url:'https://drive.google.com/file/d/'+encodeURIComponent(r.id)+'/preview';
      body.innerHTML+=`<iframe class="doc-frame" title="${esc(r.title)}" src="${esc(preview)}" loading="lazy" referrerpolicy="no-referrer" allowfullscreen></iframe><p class="dialog-note">Nếu khung xem chưa tải được, dùng nút “Mở ở tab mới” phía trên.</p>`;
    } else {
      body.innerHTML+=`<div class="dialog-note"><strong>Mẫu có thể chỉnh sửa</strong>Mở tài liệu trên Google Drive. Tạo bản sao vào thư mục của nhóm trước khi sửa; sau đó chia sẻ liên kết sản phẩm cho GV.<div class="button-row">${link(url,'Mở mẫu trên Drive','button secondary small')}</div></div>`;
    }
    body.innerHTML+=`<p class="dialog-file-name">${esc(r.name)}</p>`;
    if(typeof dialog.showModal==='function')dialog.showModal();else window.open(url,'_blank','noopener,noreferrer');
  }

    display.textContent=String(Math.floor(clockSeconds/60)).padStart(2,'0')+':'+String(clockSeconds%60).padStart(2,'0');
  }
  function timerStart() {
    const button=document.getElementById('timer-button');
    if(clockTimer){clearInterval(clockTimer);clockTimer=undefined;button.textContent='Tiếp tục';return;}
    if(clockSeconds===0)clockSeconds=240;
    button.textContent='Tạm dừng';timerRender();
    const target=Date.now()+clockSeconds*1000;
    clockTimer=setInterval(()=>{
      clockSeconds=Math.max(0,Math.ceil((target-Date.now())/1000));timerRender();
      if(clockSeconds===0){clearInterval(clockTimer);clockTimer=undefined;button.textContent='Tập lại';document.getElementById('timer-status').textContent='Hết 4 phút. Chuyển sang hỏi đáp 2 phút.';}
    },250);
  }
  document.getElementById('profile').innerHTML+='<optgroup label="Sáu hồ sơ AI">'+D.profiles.map(p=>`<option value="${p.id}">${p.id}. ${esc(p.name)}</option>`).join('')+'</optgroup>';
  document.getElementById('profile').addEventListener('change',e=>{state.profile=e.target.value;persist();render();toast(state.profile?'Đang xem hồ sơ '+profile().name+'.':'Đang xem tất cả hồ sơ.');});
  document.getElementById('menu-toggle').addEventListener('click',()=>{
    const opened=document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('nav-shade').hidden=!opened;
    document.getElementById('menu-toggle').setAttribute('aria-expanded',String(opened));
    document.getElementById('menu-toggle').setAttribute('aria-label',opened?'Đóng menu':'Mở menu');
    document.body.classList.toggle('menu-open',opened);
    document.getElementById('sidebar').inert=!opened;
    document.getElementById('sidebar').setAttribute('aria-hidden',String(!opened));
  });
  document.getElementById('nav-shade').addEventListener('click',closeMenu);
  document.addEventListener('keydown',e=>{if(e.key==='Escape' && document.getElementById('sidebar').classList.contains('open')){closeMenu();document.getElementById('menu-toggle').focus();}});
  document.querySelector('.skip-link').addEventListener('click',e=>{e.preventDefault();main.focus();});
  window.matchMedia('(max-width: 760px)').addEventListener('change',closeMenu);
  document.getElementById('close-dialog').addEventListener('click',()=>document.getElementById('resource-dialog').close());
  document.getElementById('resource-dialog').addEventListener('close',()=>{document.getElementById('dialog-body').innerHTML='';if(lastFocus?.isConnected)lastFocus.focus();});
  main.addEventListener('click',async e=>{
    const button=e.target.closest('button');if(!button)return;
    if(button.dataset.resource){openResource(button.dataset.resource);return;}
    if(button.dataset.selectProfile){state.profile=button.dataset.selectProfile;persist();render();toast('Đã chọn hồ sơ '+profile().name+'.');return;}
    if(button.dataset.rubricTab){rubricType=button.dataset.rubricTab;render();main.querySelector('[data-rubric-tab="'+rubricType+'"]').focus();return;}
    if(button.dataset.copyDraft){
      const text=state.drafts[button.dataset.copyDraft]||'';
      try {await navigator.clipboard.writeText(text);toast('Đã sao chép. Dán vào Form khi nộp bài.');}
      catch {const area=main.querySelector('[data-draft="'+button.dataset.copyDraft+'"]');area?.focus();area?.select();toast('Nháp đã được chọn. Nhấn Ctrl+C hoặc sao chép trên điện thoại.');}
      return;
    }
    switch(button.dataset.action){
      case 'print':window.print();break;
      case 'clear-rubric':state.scores[rubricType]={};persist();render();toast('Đã bỏ các mức của rubric đang xem.');break;
      case 'timer':timerStart();break;
      case 'reset-timer':clearInterval(clockTimer);clockTimer=undefined;clockSeconds=240;timerRender();document.getElementById('timer-button').textContent='Bắt đầu';document.getElementById('timer-status').textContent='Phân chia để mọi thành viên cùng tham gia.';break;
    }
  });
  main.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='resource-search'){filters.search=t.value;updateResourceResults();}
    if(t.dataset.draft){state.drafts[t.dataset.draft]=t.value;persist();if(t.dataset.draft==='concept')document.getElementById('concept-word-count').textContent=wordCount(t.value)+' từ · mục tiêu 100–150';}
    if(t.dataset.calc){state.calculator[t.dataset.calc]=t.value;persist();updateCalculator();}
  });
  main.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.checkKey){const key=t.dataset.checkKey;state.checks[key]=checksFor(key);state.checks[key][t.dataset.checkIndex]=t.checked;persist();updateCheckCount(key);}
    if(t.dataset.rubric){const type=t.dataset.rubric;state.scores[type] ||= {};state.scores[type][t.dataset.criterion]=Number(t.value);persist();const score=rubricScore(type);document.getElementById('rubric-total').innerHTML=number(score.total)+' <span>/ 10</span>';document.getElementById('rubric-completed').textContent=score.count+'/'+RUBRICS[type].rows.length+' tiêu chí đã chọn · Đây là điểm tự đối chiếu.';}
    if(t.id==='resource-folder'){filters.folder=t.value;updateResourceResults();}
    if(t.id==='resource-type'){filters.type=t.value;updateResourceResults();}
  });
  window.addEventListener('hashchange',()=>render(true));
  render();
})();

</script>
</body>
</html>
